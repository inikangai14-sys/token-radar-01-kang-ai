<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar Jujur — honest token launch radar</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#board">Skip to board</a>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="brand-name">radar-jujur / token-radar-01</span>
      </div>
      <div class="top-meta">
        <span id="as-of">snapshot</span>
        <span id="model-name">model</span>
        <span id="row-count">rows</span>
      </div>
    </header>
    <main>
      <section class="lede">
        <div>
          <h1>Token launches, priced with their uncertainty showing.</h1>
          <p>Ranked by fitted implied value from the sealed snapshot. Every row carries its own P25–P75 range, launch odds, model arithmetic, nearest traded comparables and costed farm steps.</p>
        </div>
        <div class="facts" id="facts"></div>
      </section>
      <div id="board"></div>
      <section class="panel model-panel" id="validation-panel"></section>
      <section class="panel model-panel" id="audit-panel"></section>
    </main>
  </div>
  <div id="detail-root"></div>
  <script src="../data.js"></script>
  <script src="app.js"></script>
</body>
</html>
